version: '3.8'

services:
  backend:
    image: gashyjet/backend-app:latest
    container_name: backend
    ports:
      - "8000:8000"  # adjust as needed
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: postgres
    container_name: postgres-db
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
  frontend:
    image: gashyjet/next-front:latest
    container_name: frontend
    ports:
      - "3000:3000"   # adjust as needed
    environment:
      - NODE_ENV=production
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: